name: Build Zink APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: write

concurrency:
  group: zink-apk-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore permanent signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          python3 - <<'PYTHON'
          import base64
          import os
          from pathlib import Path

          names = ('SIGNING_KEYSTORE_BASE64', 'SIGNING_STORE_PASSWORD',
                   'SIGNING_KEY_ALIAS', 'SIGNING_KEY_PASSWORD')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing GitHub Actions secrets: ' + ', '.join(missing))
          key = Path(os.environ['RUNNER_TEMP']) / 'zink-signing.jks'
          try:
              decoded = base64.b64decode(os.environ['SIGNING_KEYSTORE_BASE64'], validate=True)
          except ValueError:
              raise SystemExit('SIGNING_KEYSTORE_BASE64 is invalid Base64')
          if not decoded:
              raise SystemExit('Signing keystore is empty')
          key.write_bytes(decoded)
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ZINK_SIGNING_KEYSTORE={key}\n')
              output.write(f"ZINK_VERSION_CODE={1000 + int(os.environ['GITHUB_RUN_NUMBER'])}\n")
          PYTHON
          keytool -list -keystore "$RUNNER_TEMP/zink-signing.jks" \
            -storepass:env SIGNING_STORE_PASSWORD -alias "$SIGNING_KEY_ALIAS" > /dev/null

      # Keep the installed application ID; use the permanent key for this variant.
      - name: Build and test
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Prepare universal APK
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import shutil

          output = pathlib.Path('app/build/outputs/apk/debug')
          metadata = json.loads((output / 'output-metadata.json').read_text())
          universal = [item for item in metadata['elements'] if not item.get('filters')]
          if len(universal) != 1:
              raise SystemExit('Expected one universal debug APK')
          destination = pathlib.Path('release/Zink.apk')
          destination.parent.mkdir(exist_ok=True)
          shutil.copy2(output / universal[0]['outputFile'], destination)
          PY

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/zink-signing.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Zink
          path: release/Zink.apk
          if-no-files-found: error

      - name: Publish APK release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: zink-${{ github.run_id }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Zink
          files: release/Zink.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          body: |
            Zink APK signed with the permanent Zink key. Keep Zink installed for future updates.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
