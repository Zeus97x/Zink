name: Build Zink APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: write

concurrency:
  group: zink-apk-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v5

      # Debug signing avoids introducing new signing-key requirements.
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Prepare universal APK
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import shutil

          output = pathlib.Path('app/build/outputs/apk/debug')
          metadata = json.loads((output / 'output-metadata.json').read_text())
          universal = [item for item in metadata['elements'] if not item.get('filters')]
          if len(universal) != 1:
              raise SystemExit('Expected one universal debug APK')
          destination = pathlib.Path('release/Zink.apk')
          destination.parent.mkdir(exist_ok=True)
          shutil.copy2(output / universal[0]['outputFile'], destination)
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Zink
          path: release/Zink.apk
          if-no-files-found: error

      - name: Publish APK release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: zink-${{ github.run_id }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Zink
          files: release/Zink.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          body: |
            Zink APK. This is a debug-signed build.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
